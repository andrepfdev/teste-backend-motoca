services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: motoca_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    networks:
      - motoca_network
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c", "chown -R www-data:www-data /var/www/storage /var/www/bootstrap/cache && chmod -R 775 /var/www/storage /var/www/bootstrap/cache && php-fpm"]

  nginx:
    image: nginx:alpine
    container_name: motoca_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - motoca_network
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    container_name: motoca_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-teste_andre}
      POSTGRES_USER: ${DB_USERNAME:-meutesteandre}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-9vRo7GMXf!lxOSwg}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - motoca_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-meutesteandre} -d ${DB_DATABASE:-teste_andre}"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    container_name: motoca_pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@motoca.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    user: root
    volumes:
      - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./docker/pgadmin/pgpass:/tmp/pgpass:ro
      - pgadmin_data:/var/lib/pgadmin
    entrypoint: >
      /bin/sh -c "
        cp /tmp/pgpass /var/lib/pgadmin/pgpass &&
        chmod 600 /var/lib/pgadmin/pgpass &&
        chown 5050:5050 /var/lib/pgadmin/pgpass &&
        /entrypoint.sh
      "
    networks:
      - motoca_network
    depends_on:
      - postgres

networks:
  motoca_network:
    driver: bridge

volumes:
  postgres_data:
  pgadmin_data:
